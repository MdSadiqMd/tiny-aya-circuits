[project]
name = "aya-circuits"
version = "0.1.0"
description = "EAP-IG circuits on CohereLabs/tiny-aya-global with CircuitKIT: discovery, signed edges, faithfulness pillars, same-path random controls"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Md.Sadiq", email = "mohammadsadiq4950@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "circuitkit==0.2.0",
    "huggingface-hub",
    "pyyaml",
    "safetensors",
    "scipy",
    "torch",
    "transformers",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aya_circuits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "NPY"]
